<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>999コイン 47都道府県 塗り絵LIVE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f7f7f7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
}

body {
    display: flex;
    justify-content: center;
    overflow: hidden;
}

/* TikTok LIVE向け縦画面 */
.app {
    width: min(100vw, 480px);
    height: 100vh;
    background: white;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* 上部 */
.header {
    padding: 14px 16px 10px;
    text-align: center;
    background: white;
    z-index: 10;
}

.title {
    font-size: 24px;
    font-weight: 900;
    color: #222;
}

.subtitle {
    margin-top: 4px;
    font-size: 14px;
    color: #777;
}

/* カウンター */
.status {
    display: flex;
    gap: 8px;
    padding: 0 12px 10px;
}

.statusBox {
    flex: 1;
    background: #f3f3f3;
    border-radius: 14px;
    padding: 9px 5px;
    text-align: center;
}

.statusLabel {
    font-size: 11px;
    color: #777;
}

.statusValue {
    margin-top: 2px;
    font-size: 23px;
    font-weight: 900;
}

/* メッセージ */
.message {
    margin: 0 12px 8px;
    padding: 9px;
    border-radius: 12px;
    background: #fff5df;
    color: #7b5100;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
}

/* 地図 */
.mapArea {
    flex: 1;
    min-height: 0;
    padding: 5px 8px;
    position: relative;
}

#map {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

.prefecture {
    fill: #eeeeee;
    stroke: #777;
    stroke-width: 0.8;
    vector-effect: non-scaling-stroke;
    cursor: pointer;
    transition: fill 0.15s ease;
}

.prefecture:hover {
    fill: #ffe0ed;
}

.prefecture.painted {
    fill: #ff70a6;
    stroke: #444;
}

/* 県名 */
.prefLabel {
    pointer-events: none;
    user-select: none;
    font-size: 9px;
    font-weight: 700;
    fill: #333;
    text-anchor: middle;
    dominant-baseline: middle;
}

/* 下部ボタン */
.controls {
    padding: 10px 12px 14px;
    background: white;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

button {
    border: none;
    border-radius: 14px;
    min-height: 52px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
}

#coinButton {
    background: #ff4f91;
    color: white;
}

#coinButton.ready {
    background: #ff1744;
    animation: pulse 0.9s infinite;
}

#resetButton {
    background: #eeeeee;
    color: #333;
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }

    100% {
        transform: scale(1);
    }
}

/* 完成表示 */
.complete {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.96);
    z-index: 100;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.complete.show {
    display: flex;
}

.completeInner {
    width: 100%;
}

.completeTitle {
    font-size: 38px;
    font-weight: 1000;
    color: #ff4f91;
}

.completeText {
    margin-top: 12px;
    font-size: 18px;
    font-weight: 700;
}

.completeButton {
    margin-top: 25px;
    width: 100%;
    background: #222;
    color: white;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">
            🇯🇵 47都道府県 塗り絵
        </div>

        <div class="subtitle">
            999コインで1県を塗ります！
        </div>
    </div>

    <div class="status">

        <div class="statusBox">
            <div class="statusLabel">
                塗った県
            </div>

            <div class="statusValue">
                <span id="paintedCount">0</span>/47
            </div>
        </div>

        <div class="statusBox">
            <div class="statusLabel">
                999コイン
            </div>

            <div class="statusValue">
                <span id="coinCount">0</span>
            </div>
        </div>

    </div>

    <div id="message" class="message">
        「999コイン受信」を押してから、県をタップ！
    </div>

    <div class="mapArea">
        <svg id="map"
             viewBox="0 0 1000 1000"
             preserveAspectRatio="xMidYMid meet">
        </svg>
    </div>

    <div class="controls">

        <button id="coinButton">
            💰 999コイン受信
        </button>

        <button id="resetButton">
            🔄 リセット
        </button>

    </div>

    <!-- 完成画面 -->
    <div id="complete" class="complete">

        <div class="completeInner">

            <div class="completeTitle">
                🎉 COMPLETE!
            </div>

            <div class="completeText">
                47都道府県コンプリート！
                <br>
                みんなの応援ありがとう！
            </div>

            <button
                class="completeButton"
                onclick="closeComplete()">
                地図を見る
            </button>

        </div>

    </div>

</div>


<!-- D3.js -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>


<script>

/* =====================================================
   47都道府県 GeoJSON
   ===================================================== */

const GEOJSON_URL =
"https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson";


/* =====================================================
   都道府県名
   ===================================================== */

const PREFECTURES = [
    "北海道",
    "青森県",
    "岩手県",
    "宮城県",
    "秋田県",
    "山形県",
    "福島県",
    "茨城県",
    "栃木県",
    "群馬県",
    "埼玉県",
    "千葉県",
    "東京都",
    "神奈川県",
    "新潟県",
    "富山県",
    "石川県",
    "福井県",
    "山梨県",
    "長野県",
    "岐阜県",
    "静岡県",
    "愛知県",
    "三重県",
    "滋賀県",
    "京都府",
    "大阪府",
    "兵庫県",
    "奈良県",
    "和歌山県",
    "鳥取県",
    "島根県",
    "岡山県",
    "広島県",
    "山口県",
    "徳島県",
    "香川県",
    "愛媛県",
    "高知県",
    "福岡県",
    "佐賀県",
    "長崎県",
    "熊本県",
    "大分県",
    "宮崎県",
    "鹿児島県",
    "沖縄県"
];


/* =====================================================
   状態
   ===================================================== */

let geoData = null;

let painted = new Set();

let coinCount = 0;

let waitingForTap = false;


/* =====================================================
   SVG
   ===================================================== */

const svg = d3.select("#map");

const width = 1000;
const height = 1000;


/* =====================================================
   GeoJSON読み込み
   ===================================================== */

async function loadMap() {

    try {

        setMessage("地図を読み込んでいます…");

        const response =
            await fetch(GEOJSON_URL);

        if (!response.ok) {
            throw new Error(
                "GeoJSONの読み込みに失敗しました"
            );
        }

        geoData = await response.json();

        drawMap();

        setMessage(
            "「999コイン受信」を押してから、県をタップ！"
        );

    } catch (error) {

        console.error(error);

        setMessage(
            "地図の読み込みに失敗しました。"
        );
    }
}


/* =====================================================
   GeoJSON → SVG
   ===================================================== */

function drawMap() {

    svg.selectAll("*").remove();


    /*
     * 日本全体をSVGいっぱいに収める
     */
    const projection =
        d3.geoMercator()
          .fitExtent(
              [
                  [30, 30],
                  [970, 970]
              ],
              geoData
          );


    const path =
        d3.geoPath()
          .projection(projection);


    /*
     * 都道府県ポリゴン
     */
    svg.selectAll(".prefecture")
        .data(geoData.features)
        .enter()
        .append("path")
        .attr("class", "prefecture")
        .attr("d", path)
        .attr("data-name", getPrefectureName)
        .on("click", function(event, d) {

            handlePrefectureClick(
                d,
                this
            );

        });


    /*
     * 県名を表示
     */
    svg.selectAll(".prefLabel")
        .data(geoData.features)
        .enter()
        .append("text")
        .attr("class", "prefLabel")
        .attr("x", d =>
            path.centroid(d)[0]
        )
        .attr("y", d =>
            path.centroid(d)[1]
        )
        .text(getPrefectureName);

}


/* =====================================================
   都道府県名取得
   ===================================================== */

function getPrefectureName(d) {

    const p = d.properties || {};

    return (
        p.name ||
        p.N03_001 ||
        p.N03_003 ||
        p.nam_ja ||
        p.NAME_1 ||
        p.prefecture ||
        "不明"
    );
}


/* =====================================================
   都道府県タップ
   ===================================================== */

function handlePrefectureClick(
    data,
    element
) {

    const name =
        getPrefectureName(data);


    /*
     * 999コインを受信していない場合
     */
    if (!waitingForTap) {

        setMessage(
            "先に「999コイン受信」を押してください！"
        );

        return;
    }


    /*
     * すでに塗った県
     */
    if (painted.has(name)) {

        setMessage(
            `${name}は、すでに塗られています！`
        );

        return;
    }


    /*
     * 塗る
     */
    painted.add(name);

    d3.select(element)
        .classed("painted", true);


    /*
     * 状態更新
     */
    waitingForTap = false;

    updateCounter();


    setMessage(
        `🎨 ${name}を塗りました！`
    );


    document
        .getElementById("coinButton")
        .classList.remove("ready");


    /*
     * 47県完成
     */
    if (painted.size >= 47) {

        setTimeout(
            showComplete,
            400
        );

    }

}


/* =====================================================
   999コイン受信
   ===================================================== */

document
    .getElementById("coinButton")
    .addEventListener(
        "click",
        function() {

            if (painted.size >= 47) {
                return;
            }


            /*
             * すでに999コイン受信済み
             */
            if (waitingForTap) {

                setMessage(
                    "県をタップして塗ってください！"
                );

                return;
            }


            /*
             * 999コイン受信
             */
            coinCount++;

            waitingForTap = true;


            document
                .getElementById("coinButton")
                .classList.add("ready");


            updateCounter();


            setMessage(
                "💰 999コイン受信！塗る県をタップ！"
            );

        }
    );


/* =====================================================
   カウンター
   ===================================================== */

function updateCounter() {

    document
        .getElementById("paintedCount")
        .textContent =
        painted.size;


    document
        .getElementById("coinCount")
        .textContent =
        coinCount;

}


/* =====================================================
   メッセージ
   ===================================================== */

function setMessage(text) {

    document
        .getElementById("message")
        .textContent =
        text;

}


/* =====================================================
   リセット
   ===================================================== */

document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        function() {

            if (
                !confirm(
                    "塗った県をすべてリセットしますか？"
                )
            ) {
                return;
            }


            painted.clear();

            coinCount = 0;

            waitingForTap = false;


            svg.selectAll(".prefecture")
                .classed(
                    "painted",
                    false
                );


            document
                .getElementById("coinButton")
                .classList.remove("ready");


            updateCounter();


            setMessage(
                "「999コイン受信」を押してから、県をタップ！"
            );

        }
    );


/* =====================================================
   完成
   ===================================================== */

function showComplete() {

    document
        .getElementById("complete")
        .classList.add("show");

}


function closeComplete() {

    document
        .getElementById("complete")
        .classList.remove("show");

}


/* =====================================================
   起動
   ===================================================== */

loadMap();

</script>

</body>
</html>
