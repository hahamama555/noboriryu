<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>999コイン 47都道府県 塗り絵LIVE</title>

<!-- D3.js -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

body{
  background:#ffffff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

/* =========================
   9:16 アプリ画面
========================= */

.app{
  width:min(100vw, calc(100dvh * 9 / 16));
  height:min(100dvh, calc(100vw * 16 / 9));

  aspect-ratio:9 / 16;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:#fff;
  color:#111;
}

/* =========================
   タイトル
========================= */

.title{
  flex:0 0 auto;

  margin:8px 8px 2px;

  padding:5px 8px;

  font-size:clamp(17px, 5vw, 26px);
  line-height:1.2;
  font-weight:900;

  text-align:center;

  border-radius:10px;

  min-height:1.2em;

  cursor:text;

  outline:none;

  word-break:break-word;

  user-select:text;
}

.title:focus{
  background:#f3f3f3;
  box-shadow:0 0 0 2px #ddd inset;
}

.title:empty::before{
  content:"ここをタップしてタイトルを入力";
  color:#aaa;
}

/* =========================
   サブタイトル
========================= */

.sub{
  flex:0 0 auto;

  text-align:center;

  font-size:clamp(10px, 2.8vw, 14px);

  font-weight:700;

  color:#555;

  margin:0 8px 5px;
}

/* =========================
   メインパネル
========================= */

.panel{
  flex:1 1 auto;

  min-height:0;

  display:flex;
  flex-direction:column;

  margin:0 7px 7px;

  border:2px solid #111;
  border-radius:16px;

  padding:7px;

  overflow:hidden;
}

/* =========================
   地図
========================= */

#mapWrap{
  flex:1 1 auto;

  min-height:0;

  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  overflow:hidden;

  background:#fff;

  border-radius:10px;
}

#map{
  width:100%;
  height:100%;

  display:block;

  touch-action:manipulation;
}

/* =========================
   都道府県
========================= */

.pref{
  fill:#ffffff;

  fill-opacity:1;

  stroke:#333;

  stroke-width:0.8;

  cursor:pointer;

  transition:
    fill 0.15s ease,
    fill-opacity 0.15s ease;
}

.pref:hover{
  fill:#ffe27a;
}

.pref.pending{
  fill:#ffe27a;

  fill-opacity:.75;
}

.pref.active{
  fill:#ff8a3d;

  fill-opacity:.88;

  stroke:#9a4b12;

  stroke-width:1.3;
}

/* =========================
   メッセージ
========================= */

#message{
  flex:0 0 auto;

  text-align:center;

  font-weight:800;

  font-size:clamp(11px, 3.2vw, 16px);

  line-height:1.25;

  min-height:28px;

  margin:5px 2px 3px;

  display:flex;

  align-items:center;

  justify-content:center;
}

/* =========================
   ボタン
========================= */

.controls{
  flex:0 0 auto;

  display:flex;

  gap:7px;

  justify-content:center;

  margin-top:2px;
}

button{
  border:0;

  border-radius:999px;

  padding:
    10px
    15px;

  font-weight:900;

  font-size:clamp(12px, 3.5vw, 15px);

  cursor:pointer;

  touch-action:manipulation;
}

#arm{
  background:#111;
  color:#fff;
}

#arm.armed{
  background:#e53935;
}

#reset{
  background:#eee;
  color:#333;
}

/* =========================
   数値
========================= */

.stats{
  flex:0 0 auto;

  display:flex;

  justify-content:center;

  gap:22px;

  margin-top:4px;

  font-size:clamp(11px, 3.2vw, 14px);

  font-weight:700;
}

.num{
  font-size:clamp(18px, 5vw, 23px);

  font-weight:900;
}

/* =========================
   凡例
========================= */

.legend{
  flex:0 0 auto;

  display:flex;

  justify-content:center;

  gap:14px;

  margin-top:3px;

  font-size:clamp(9px, 2.7vw, 12px);

  color:#555;
}

.dot{
  display:inline-block;

  width:11px;
  height:11px;

  border-radius:3px;

  vertical-align:-2px;

  margin-right:3px;
}

.orange{
  background:#ff8a3d;
}

.yellow{
  background:#ffe27a;
}

/* =========================
   注意書き
========================= */

.note{
  flex:0 0 auto;

  font-size:9px;

  color:#888;

  line-height:1.3;

  margin-top:3px;

  text-align:center;
}

/* =========================
   読み込み
========================= */

.loading{
  padding:30px 10px;

  text-align:center;

  color:#777;

  font-size:13px;
}

/* =========================
   完成表示
========================= */

.complete{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  background:rgba(255,255,255,.92);

  z-index:1000;
}

.complete.show{
  display:flex;
}

.completeBox{
  width:min(86vw,420px);

  text-align:center;

  padding:28px 20px;

  border:3px solid #111;

  border-radius:20px;

  background:#fff;

  box-shadow:0 8px 30px rgba(0,0,0,.15);
}

.completeTitle{
  font-size:clamp(24px, 7vw, 36px);

  font-weight:900;

  margin-bottom:10px;
}

.completeText{
  font-size:16px;

  font-weight:700;

  line-height:1.6;

  margin-bottom:18px;
}

.completeBox button{
  background:#111;

  color:#fff;

  padding:12px 24px;
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       タイトル
       タップして編集できます
  ========================== -->

  <div
    id="editableTitle"
    class="title"
    contenteditable="true"
    spellcheck="false"
    onclick="this.focus()"
  >🎁 999コインで47都道府県を塗ろう！</div>

  <div class="sub">
    999コイン → 1都道府県を色塗り
  </div>

  <div class="panel">

    <!-- 地図 -->

    <div id="mapWrap">

      <div
        id="loading"
        class="loading"
      >
        47都道府県の地図を読み込んでいます…
      </div>

      <svg
        id="map"
        viewBox="0 0 900 760"
        preserveAspectRatio="xMidYMid meet"
        style="display:none"
      ></svg>

    </div>

    <!-- メッセージ -->

    <div id="message">
      「999コイン受信」を押してから、塗りたい都道府県をタップ
    </div>

    <!-- ボタン -->

    <div class="controls">

      <button id="arm">
        💰 999コイン受信
      </button>

      <button id="reset">
        ↺ リセット
      </button>

    </div>

    <!-- カウント -->

    <div class="stats">

      <div>
        塗った県
        <span class="num" id="count">0</span>
        / 47
      </div>

      <div>
        999コイン
        <span class="num" id="coins">0</span>
      </div>

    </div>

    <!-- 凡例 -->

    <div class="legend">

      <span>
        <i class="dot orange"></i>
        塗り済み
      </span>

      <span>
        <i class="dot yellow"></i>
        次に塗れる県
      </span>

    </div>

    <div class="note">
      ※色が付いた都道府県をもう一度タップすると取り消せます
    </div>

  </div>

</div>


<!-- =========================
     コンプリート表示
========================= -->

<div id="complete" class="complete">

  <div class="completeBox">

    <div class="completeTitle">
      🎊 COMPLETE!
    </div>

    <div class="completeText">
      47都道府県<br>
      全部塗れました！<br>
      おめでとうございます🎉
    </div>

    <button id="closeComplete">
      閉じる
    </button>

  </div>

</div>


<script>

/* =========================================================
   GeoJSON
========================================================= */

const GEOJSON_URL =
  'https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson';


/* =========================================================
   D3
========================================================= */

const svg = d3.select('#map');


/* =========================================================
   状態
========================================================= */

const state = {

  // 999コインを受信して次の県を塗れる状態か
  armed:false,

  // 塗り済み都道府県
  painted:new Set(),

  // 999コイン数
  coins:0

};


/* =========================================================
   HTML要素
========================================================= */

const armBtn =
  document.getElementById('arm');

const resetBtn =
  document.getElementById('reset');

const msg =
  document.getElementById('message');

const countEl =
  document.getElementById('count');

const coinsEl =
  document.getElementById('coins');

const titleEl =
  document.getElementById('editableTitle');

const completeEl =
  document.getElementById('complete');


/* =========================================================
   タイトル保存
========================================================= */

const savedTitle =
  localStorage.getItem('prefecturePaintTitle');

if(savedTitle !== null){

  titleEl.textContent = savedTitle;

}


/* タイトル変更時に自動保存 */

titleEl.addEventListener(
  'input',
  function(){

    localStorage.setItem(
      'prefecturePaintTitle',
      titleEl.textContent.trim()
    );

  }
);


/* Enterで改行しない */

titleEl.addEventListener(
  'keydown',
  function(event){

    if(event.key === 'Enter'){

      event.preventDefault();

      titleEl.blur();

    }

  }
);


/* =========================================================
   GeoJSONから都道府県名を取得
========================================================= */

function getName(feature){

  const p = feature.properties || {};

  return (
    p.name ||
    p.nam ||
    p.NAME_1 ||
    p.NAME ||
    p.prefecture ||
    p.pref ||
    p.都道府県 ||
    ''
  );

}


/* =========================================================
   地図読み込み
========================================================= */

async function load(){

  try{

    const response =
      await fetch(GEOJSON_URL);

    if(!response.ok){

      throw new Error(
        'GeoJSON ' + response.status
      );

    }

    const data =
      await response.json();


    /*
      GeoJSONの中から
      都道府県データだけを取得
    */

    const features =
      data.features.filter(
        function(feature){

          const name =
            getName(feature);

          return (
            !!name &&
            name !== '日本' &&
            !name.includes('離島') &&
            !name.includes('minor')
          );

        }
      );


    /* =====================================================
       地図をSVG内にフィット
    ===================================================== */

    const projection =
      d3.geoMercator()
        .fitExtent(
          [
            [18,18],
            [882,742]
          ],
          {
            type:'FeatureCollection',
            features:features
          }
        );


    const path =
      d3.geoPath(projection);


    /* 一度クリア */

    svg.selectAll('*').remove();


    /* =====================================================
       都道府県ポリゴンを描画
    ===================================================== */

    svg
      .selectAll('path.pref')
      .data(features)
      .join('path')

      .attr('class','pref')

      .attr(
        'd',
        function(d){
          return path(d);
        }
      )

      .attr(
        'data-name',
        function(d){
          return getName(d);
        }
      )

      /*
        ここが重要！

        タップした都道府県そのものを
        selectPref()へ渡します。
      */

      .on(
        'click',
        function(event,d){

          event.preventDefault();

          selectPref(
            getName(d),
            this
          );

        }
      )

      /*
        長押し・スマホ操作にも対応
      */

      .on(
        'touchstart',
        function(event,d){

          /*
            clickイベントも発生するため、
            ここでは処理しません。
          */

        }
      )

      .append('title')

      .text(
        function(d){
          return getName(d);
        }
      );


    /* 読み込み表示を消す */

    document.getElementById(
      'loading'
    ).style.display = 'none';


    svg.style(
      'display',
      'block'
    );


    msg.textContent =
      '「999コイン受信」を押してから、塗りたい都道府県をタップ';


  }catch(error){

    console.error(error);

    document.getElementById(
      'loading'
    ).innerHTML =
      '読み込みに失敗しました。<br>' +
      'インターネット接続を確認してください。';

  }

}


/* =========================================================
   都道府県タップ
========================================================= */

function selectPref(name,el){

  if(!name){
    return;
  }


  /* =======================================================
     ★ すでに色が付いている場合
        → もう一度タップで取り消し
  ======================================================= */

  if(state.painted.has(name)){

    /* Setから削除 */

    state.painted.delete(name);


    /* コイン数を1減らす */

    state.coins =
      Math.max(0,state.coins - 1);


    /* 色を消す */

    el.classList.remove('active');


    /* 表示更新 */

    updateStats();


    /*
      999コイン待ち状態には戻さず、
      そのまま通常状態にします。
    */

    state.armed = false;

    armBtn.classList.remove('armed');

    armBtn.textContent =
      '💰 999コイン受信';


    /*
      他の県のpending表示も消す
    */

    svg
      .selectAll('path.pref')
      .classed(
        'pending',
        false
      );


    msg.textContent =
      '↩️ ' +
      name +
      ' の色塗りを取り消しました。';


    return;

  }


  /* =======================================================
     まだ色が付いていない場合
  ======================================================= */

  if(!state.armed){

    msg.textContent =
      '先に「999コイン受信」を押してください。';

    return;

  }


  /* =======================================================
     色を付ける
  ======================================================= */

  state.painted.add(name);

  state.coins++;


  /* 999コイン受信状態を解除 */

  state.armed = false;


  /* 選択された県の表示 */

  el.classList.remove('pending');

  el.classList.add('active');


  /* 他の県のpending表示も消す */

  svg
    .selectAll('path.pref')
    .classed(
      'pending',
      false
    );


  /* ボタンを元に戻す */

  armBtn.classList.remove('armed');

  armBtn.textContent =
    '💰 999コイン受信';


  /* 数字更新 */

  updateStats();


  /* メッセージ */

  msg.textContent =
    '🎉 ' +
    name +
    ' を塗りました！ 次の999コインを待っています。';


  /* =======================================================
     47都道府県コンプリート
  ======================================================= */

  if(state.painted.size === 47){

    msg.textContent =
      '🎊 47都道府県コンプリート！ おめでとう！';

    completeEl.classList.add('show');

  }

}


/* =========================================================
   カウント表示更新
========================================================= */

function updateStats(){

  countEl.textContent =
    state.painted.size;

  coinsEl.textContent =
    state.coins;

}


/* =========================================================
   999コイン受信ボタン
========================================================= */

armBtn.onclick =
  function(){

    /*
      47県全部塗っている場合
    */

    if(state.painted.size === 47){

      msg.textContent =
        '🎊 47都道府県コンプリート済みです！';

      return;

    }


    /* 状態を反転 */

    state.armed =
      !state.armed;


    if(state.armed){

      /*
        999コインを受信した状態
      */

      armBtn.classList.add('armed');

      armBtn.textContent =
        '🔴 次の県をタップ';


      /*
        まだ塗られていない県を
        黄色表示
      */

      svg
        .selectAll('path.pref')
        .classed(
          'pending',
          function(){

            const name =
              this.getAttribute(
                'data-name'
              );

            return !state.painted.has(name);

          }
        );


      msg.textContent =
        '999コインを受信！ 塗りたい都道府県をタップしてください。';

    }else{

      /*
        待機状態に戻す
      */

      armBtn.classList.remove('armed');

      armBtn.textContent =
        '💰 999コイン受信';


      svg
        .selectAll('path.pref')
        .classed(
          'pending',
          false
        );


      msg.textContent =
        '待機中に戻しました。';

    }

  };


/* =========================================================
   リセット
========================================================= */

resetBtn.onclick =
  function(){

    /* 全状態をリセット */

    state.painted.clear();

    state.coins = 0;

    state.armed = false;


    /* 地図の色を全部消す */

    svg
      .selectAll('path.pref')
      .classed(
        'active',
        false
      )
      .classed(
        'pending',
        false
      );


    /* 表示更新 */

    updateStats();


    /* ボタン */

    armBtn.classList.remove('armed');

    armBtn.textContent =
      '💰 999コイン受信';


    /* メッセージ */

    msg.textContent =
      '「999コイン受信」を押してから、塗りたい都道府県をタップ';


    /* 完成画面を閉じる */

    completeEl.classList.remove(
      'show'
    );

  };


/* =========================================================
   COMPLETE画面を閉じる
========================================================= */

document
  .getElementById('closeComplete')
  .onclick =
  function(){

    completeEl.classList.remove(
      'show'
    );

  };


/* =========================================================
   起動
========================================================= */

load();

</script>

</body>
</html>
