<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>47都道府県 塗り絵LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  overflow: hidden;
}


/* =================================
   9:16画面
================================= */

.app {

  width: min(
    100vw,
    calc(100dvh * 9 / 16)
  );

  height: min(
    100dvh,
    calc(100vw * 16 / 9)
  );

  aspect-ratio: 9 / 16;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background: #fff;
}


/* =================================
   タイトル
================================= */

.title {

  flex: 0 0 auto;

  margin: 5px 8px 0;
  padding: 4px 5px;

  font-size: clamp(
    18px,
    5vw,
    28px
  );

  line-height: 1.2;

  font-weight: 900;

  text-align: center;

  cursor: text;

  outline: none;

  word-break: break-word;

  min-height: 1.2em;
}


/* タイトル編集中 */

.title:focus {

  background: #f5f5f5;

  border-radius: 8px;
}


/* =================================
   サブタイトル
================================= */

.sub {

  flex: 0 0 auto;

  text-align: center;

  font-size: clamp(
    10px,
    2.7vw,
    14px
  );

  font-weight: 700;

  color: #555;

  margin: 2px 5px 2px;
}


/* =================================
   地図エリア
================================= */

.mapArea {

  flex: 1 1 auto;

  min-height: 0;

  width: 100%;

  overflow: hidden;

  display: flex;

  align-items: center;

  justify-content: center;
}


/* =================================
   地図
================================= */

#map {

  width: 100%;
  height: 100%;

  display: block;

  touch-action: manipulation;
}


/* =================================
   都道府県
================================= */

.pref {

  fill: #ffffff;

  fill-opacity: 1;

  stroke: #333333;

  stroke-width: 0.8;

  cursor: pointer;

  transition:
    fill 0.12s ease,
    fill-opacity 0.12s ease;
}


/* =================================
   色が付いた県
================================= */

.pref.active {

  fill: #ff8a3d;

  fill-opacity: 0.92;

  stroke: #9a4b12;

  stroke-width: 1.3;
}


/* =================================
   メッセージ
================================= */

#message {

  flex: 0 0 auto;

  text-align: center;

  font-size: clamp(
    11px,
    3vw,
    15px
  );

  font-weight: 800;

  min-height: 25px;

  padding: 2px 5px;

  display: flex;

  align-items: center;

  justify-content: center;
}


/* =================================
   カウンター
================================= */

.stats {

  flex: 0 0 auto;

  display: flex;

  justify-content: center;

  gap: 25px;

  margin: 2px 0 4px;

  font-size: clamp(
    11px,
    3vw,
    14px
  );

  font-weight: 700;
}

.num {

  font-size: clamp(
    18px,
    5vw,
    23px
  );

  font-weight: 900;
}


/* =================================
   凡例
================================= */

.legend {

  flex: 0 0 auto;

  display: flex;

  justify-content: center;

  gap: 15px;

  margin-bottom: 3px;

  font-size: 10px;

  color: #555;
}

.dot {

  display: inline-block;

  width: 10px;
  height: 10px;

  border-radius: 3px;

  vertical-align: -1px;

  margin-right: 3px;
}

.orange {

  background: #ff8a3d;
}

.white {

  background: #fff;

  border: 1px solid #555;
}


/* =================================
   説明
================================= */

.note {

  flex: 0 0 auto;

  text-align: center;

  font-size: 8px;

  color: #999;

  margin-bottom: 3px;
}


/* =================================
   読み込み
================================= */

.loading {

  position: absolute;

  top: 50%;

  left: 50%;

  transform:
    translate(-50%, -50%);

  text-align: center;

  color: #777;

  font-size: 13px;
}


/* =================================
   COMPLETE
================================= */

.complete {

  position: fixed;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  background:
    rgba(255,255,255,0.94);

  z-index: 1000;
}

.complete.show {

  display: flex;
}

.completeBox {

  width: 85vw;

  max-width: 400px;

  padding: 28px 20px;

  text-align: center;

  background: #fff;

  border: 3px solid #111;

  border-radius: 20px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,0.18);
}

.completeTitle {

  font-size: 30px;

  font-weight: 900;

  margin-bottom: 10px;
}

.completeText {

  font-size: 16px;

  font-weight: 700;

  line-height: 1.6;

  margin-bottom: 18px;
}

.completeBox button {

  border: none;

  border-radius: 999px;

  padding: 12px 25px;

  background: #111;

  color: #fff;

  font-weight: 900;

  font-size: 15px;
}

</style>

</head>


<body>


<div class="app">


  <!-- =========================
       タイトル
  ========================== -->

  <div
    id="editableTitle"
    class="title"
    contenteditable="true"
    spellcheck="false"
  >🎁 999コインで47都道府県を塗ろう！</div>


  <div class="sub">
    都道府県をタップして色を塗ろう！
  </div>


  <!-- =========================
       地図
  ========================== -->

  <div class="mapArea">

    <div
      id="loading"
      class="loading"
    >
      47都道府県の地図を読み込んでいます…
    </div>

    <svg
      id="map"
      viewBox="0 0 900 760"
      preserveAspectRatio="xMidYMid meet"
      style="display:none"
    ></svg>

  </div>


  <!-- =========================
       メッセージ
  ========================== -->

  <div id="message">
    都道府県をタップしてください
  </div>


  <!-- =========================
       カウンター
  ========================== -->

  <div class="stats">

    <div>
      塗った県
      <span
        id="count"
        class="num"
      >0</span>
      / 47
    </div>

    <div>
      999コイン
      <span
        id="coins"
        class="num"
      >0</span>
    </div>

  </div>


  <!-- =========================
       凡例
  ========================== -->

  <div class="legend">

    <span>
      <i class="dot orange"></i>
      塗り済み
    </span>

    <span>
      <i class="dot white"></i>
      未塗色
    </span>

  </div>


  <div class="note">
    ※もう一度タップすると白に戻ります
  </div>

</div>


<!-- =========================
     COMPLETE
========================= -->

<div
  id="complete"
  class="complete"
>

  <div class="completeBox">

    <div class="completeTitle">
      🎊 COMPLETE!
    </div>

    <div class="completeText">
      47都道府県<br>
      全部塗れました！<br>
      おめでとうございます🎉
    </div>

    <button id="closeComplete">
      閉じる
    </button>

  </div>

</div>


<script>


/* ==========================================
   GeoJSON
========================================== */

const GEOJSON_URL =
  "https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson";


/* ==========================================
   SVG
========================================== */

const svg =
  d3.select("#map");


/* ==========================================
   状態
========================================== */

const painted =
  new Set();

let coins = 0;


/* ==========================================
   HTML
========================================== */

const countEl =
  document.getElementById("count");

const coinsEl =
  document.getElementById("coins");

const messageEl =
  document.getElementById("message");

const titleEl =
  document.getElementById("editableTitle");

const completeEl =
  document.getElementById("complete");


/* ==========================================
   タイトル保存
========================================== */

const savedTitle =
  localStorage.getItem(
    "prefecturePaintTitle"
  );

if (savedTitle !== null) {

  titleEl.textContent =
    savedTitle;

}


titleEl.addEventListener(
  "input",
  function () {

    localStorage.setItem(
      "prefecturePaintTitle",
      titleEl.textContent.trim()
    );

  }
);


/* Enterで改行しない */

titleEl.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      titleEl.blur();

    }

  }
);


/* ==========================================
   都道府県名
========================================== */

function getName(feature) {

  const p =
    feature.properties || {};

  return (
    p.name ||
    p.nam ||
    p.NAME_1 ||
    p.NAME ||
    p.prefecture ||
    p.pref ||
    p.都道府県 ||
    ""
  );

}


/* ==========================================
   数字更新
========================================== */

function updateStats() {

  countEl.textContent =
    painted.size;

  coinsEl.textContent =
    coins;

}


/* ==========================================
   ★ 都道府県タップ
========================================== */

function togglePrefecture(
  name,
  element
) {

  if (!name) {
    return;
  }


  /* ======================================
     すでに色が付いている
     ↓
     白に戻す
  ====================================== */

  if (
    element.classList.contains(
      "active"
    )
  ) {

    /* CSSクラスを確実に削除 */

    element.classList.remove(
      "active"
    );


    /* Setから削除 */

    painted.delete(name);


    /* コイン数も1減らす */

    coins =
      Math.max(
        0,
        coins - 1
      );


    /* 表示更新 */

    updateStats();


    messageEl.textContent =
      "↩️ " +
      name +
      " を白に戻しました。";


    return;
  }


  /* ======================================
     色が付いていない
     ↓
     オレンジにする
  ====================================== */

  element.classList.add(
    "active"
  );


  painted.add(name);


  coins++;


  updateStats();


  messageEl.textContent =
    "🎉 " +
    name +
    " を塗りました！";


  /* ======================================
     47県完成
  ====================================== */

  if (
    painted.size === 47
  ) {

    messageEl.textContent =
      "🎊 47都道府県コンプリート！";

    completeEl.classList.add(
      "show"
    );

  }

}


/* ==========================================
   地図読み込み
========================================== */

fetch(GEOJSON_URL)

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "GeoJSON " +
        response.status
      );

    }

    return response.json();

  })


  .then(function(data) {


    /* ======================================
       47都道府県を取得
    ====================================== */

    const features =
      data.features.filter(
        function(feature) {

          const name =
            getName(feature);

          return (
            name &&
            name !== "日本" &&
            !name.includes("離島") &&
            !name.includes("minor")
          );

        }
      );


    /* ======================================
       地図を最大サイズにする
    ====================================== */

    const projection =
      d3.geoMercator()
        .fitExtent(
          [
            [5, 5],
            [895, 755]
          ],
          {
            type:
              "FeatureCollection",

            features:
              features
          }
        );


    const path =
      d3.geoPath(
        projection
      );


    /* ======================================
       地図描画
    ====================================== */

    svg
      .selectAll("path")
      .data(features)
      .join("path")

      .attr(
        "class",
        "pref"
      )

      .attr(
        "d",
        function(d) {

          return path(d);

        }
      )

      .attr(
        "data-name",
        function(d) {

          return getName(d);

        }
      )


      /* ==================================
         ★ タップ
      ================================== */

      .on(
        "click",
        function(event, d) {

          event.preventDefault();

          event.stopPropagation();

          const name =
            getName(d);

          togglePrefecture(
            name,
            this
          );

        }
      )


      .append("title")

      .text(
        function(d) {

          return getName(d);

        }
      );


    /* 読み込み完了 */

    document
      .getElementById("loading")
      .style.display =
        "none";


    svg.style(
      "display",
      "block"
    );


  })


  .catch(function(error) {

    console.error(error);

    document
      .getElementById("loading")
      .innerHTML =
        "地図の読み込みに失敗しました。<br>" +
        "インターネット接続を確認してください。";

  });


/* ==========================================
   COMPLETEを閉じる
========================================== */

document
  .getElementById("closeComplete")
  .onclick = function() {

    completeEl.classList.remove(
      "show"
    );

  };


</script>

</body>
</html>
