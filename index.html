<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>47都道府県 龍が空へ登る</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
  font-family: sans-serif;
}

body {
  display: flex;
  justify-content: center;
}

.app {
  width: 100vw;
  height: 100vh;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.header {
  flex: 0 0 auto;
  text-align: center;
  padding: 12px 8px 8px;
  background: #fff;
  z-index: 10;
}

.title {
  font-size: clamp(22px, 6vw, 34px);
  font-weight: 900;
  line-height: 1.2;
  outline: none;
}

.subtitle {
  margin-top: 5px;
  font-size: clamp(13px, 3.5vw, 18px);
  font-weight: bold;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-top: 8px;
  font-size: 14px;
  font-weight: bold;
}

.mapArea {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

svg {
  width: 100%;
  height: 100%;
  display: block;
}

.prefecture {
  fill: #ffffff;
  stroke: #555;
  stroke-width: 0.8;
  cursor: pointer;
  transition: fill 0.15s ease;
}

.prefecture.active {
  fill: #ff8a00;
}

.prefecture:hover {
  filter: brightness(0.96);
}

/* 龍 */
.dragon {
  pointer-events: none;
  user-select: none;
  font-size: 48px;
}

/* キラキラ */
.sparkle {
  pointer-events: none;
  user-select: none;
  font-size: 22px;
}

.message {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  background: rgba(0,0,0,.72);
  color: #fff;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: bold;
  opacity: 0;
  transition: opacity .2s;
  z-index: 20;
  white-space: nowrap;
}

.message.show {
  opacity: 1;
}

.complete {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.75);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
  z-index: 30;
}

.complete.show {
  opacity: 1;
}

.completeBox {
  background: #fff;
  border-radius: 22px;
  padding: 25px 28px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.18);
}

.completeBox .big {
  font-size: 42px;
}

.completeBox .text {
  margin-top: 5px;
  font-size: 22px;
  font-weight: 900;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <!-- ここはタップしてタイトル変更可能 -->
    <div class="title"
         contenteditable="true"
         spellcheck="false">
      47都道府県 🐉龍の旅
    </div>

    <div class="subtitle">
      都道府県をタップすると龍が空へ登ります
    </div>

    <div class="stats">
      <div>
        塗った県：
        <span id="count">0</span> / 47
      </div>

      <div>
        999コイン：
        <span id="coins">0</span>
      </div>
    </div>

  </div>

  <div class="mapArea">
    <svg id="map"
         viewBox="0 0 900 760"
         preserveAspectRatio="xMidYMid meet">
    </svg>

    <div id="message" class="message"></div>

    <div id="complete" class="complete">
      <div class="completeBox">
        <div class="big">🐉✨🎊</div>
        <div class="text">
          47都道府県コンプリート！
        </div>
      </div>
    </div>
  </div>

</div>

<script>

const GEOJSON_URL =
  "https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson";

const svg = d3.select("#map");

const countEl = document.getElementById("count");
const coinsEl = document.getElementById("coins");
const messageEl = document.getElementById("message");
const completeEl = document.getElementById("complete");
const titleEl = document.querySelector(".title");

let painted = new Set();
let coins = 0;


/* =========================
   タイトル保存
========================= */

const savedTitle = localStorage.getItem("dragonTitle");

if (savedTitle) {
  titleEl.textContent = savedTitle;
}

titleEl.addEventListener("input", () => {
  localStorage.setItem(
    "dragonTitle",
    titleEl.textContent
  );
});


/* =========================
   メッセージ
========================= */

let messageTimer;

function showMessage(text) {

  messageEl.textContent = text;
  messageEl.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer = setTimeout(() => {
    messageEl.classList.remove("show");
  }, 1800);
}


/* =========================
   数字更新
========================= */

function updateStats() {

  countEl.textContent = painted.size;
  coinsEl.textContent = coins;

  if (painted.size === 47) {
    completeEl.classList.add("show");
  } else {
    completeEl.classList.remove("show");
  }
}


/* =========================
   龍の演出
========================= */

function dragonAnimation(x, y) {

  /*
   * 龍本体
   */
  const dragon = svg.append("text")
    .attr("class", "dragon")
    .attr("x", x)
    .attr("y", y)
    .attr("text-anchor", "middle")
    .attr("dominant-baseline", "middle")
    .style("opacity", 0)
    .text("🐉");


  /*
   * 登場
   */
  dragon
    .transition()
    .duration(150)
    .style("opacity", 1)
    .attr("transform",
      `translate(0,-10) scale(1.0)`
    )


    /*
     * 上空へ飛んでいく
     */
    .transition()
    .duration(1200)
    .ease(d3.easeCubicOut)
    .attr(
      "transform",
      `translate(45,-300) rotate(-12) scale(1.35)`
    )
    .style("opacity", 0)


    /*
     * 終わったら削除
     */
    .on("end", function() {
      d3.select(this).remove();
    });


  /*
   * キラキラを複数出す
   */
  const sparkleData = [
    { dx: -25, dy: 5 },
    { dx: 25, dy: -10 },
    { dx: -10, dy: -35 },
    { dx: 15, dy: -50 }
  ];

  sparkleData.forEach((s, i) => {

    const sparkle = svg.append("text")
      .attr("class", "sparkle")
      .attr("x", x + s.dx)
      .attr("y", y + s.dy)
      .attr("text-anchor", "middle")
      .style("opacity", 0)
      .text(i % 2 === 0 ? "✨" : "⭐");

    sparkle
      .transition()
      .delay(i * 80)
      .duration(150)
      .style("opacity", 1)

      .transition()
      .duration(900)
      .ease(d3.easeCubicOut)
      .attr(
        "transform",
        `translate(${s.dx * 0.5},-220)`
      )
      .style("opacity", 0)

      .on("end", function() {
        d3.select(this).remove();
      });

  });
}


/* =========================
   都道府県タップ
========================= */

function togglePrefecture(name, element, d) {

  if (!name) return;


  /*
   * すでに塗られている場合
   * → 白に戻す
   */
  if (element.classList.contains("active")) {

    element.classList.remove("active");

    painted.delete(name);

    coins = Math.max(0, coins - 1);

    updateStats();

    showMessage(
      "↩️ " + name + " を白に戻しました"
    );

    return;
  }


  /*
   * 新しく塗る
   */
  element.classList.add("active");

  painted.add(name);

  coins++;

  updateStats();


  /*
   * クリックされた県の中心座標
   */
  const [x, y] = path.centroid(d);


  /*
   * 龍を空へ飛ばす
   */
  dragonAnimation(x, y);


  showMessage(
    "🐉 " + name + " から龍が空へ！✨"
  );
}


/* =========================
   地図読み込み
========================= */

let path;


/*
 * GeoJSON取得
 */

d3.json(GEOJSON_URL)
  .then(data => {

    /*
     * 地図を画面いっぱいに配置
     */
    const projection =
      d3.geoMercator()
        .fitExtent(
          [
            [5, 5],
            [895, 755]
          ],
          data
        );


    path = d3.geoPath()
      .projection(projection);


    /*
     * 都道府県描画
     */
    svg.selectAll(".prefecture")
      .data(data.features)
      .enter()
      .append("path")
      .attr("class", "prefecture")
      .attr("d", path)


      /*
       * タップ処理
       */
      .on("click", function(event, d) {

        const element = this;

        const name =
          d.properties.name ||
          d.properties.nam_ja ||
          d.properties.N03_001 ||
          d.properties.prefecture;

        togglePrefecture(
          name,
          element,
          d
        );

      });

  })


  .catch(error => {

    console.error(error);

    showMessage(
      "地図の読み込みに失敗しました"
    );

  });


/* =========================
   コンプリート画面
========================= */

completeEl.addEventListener("click", () => {

  completeEl.classList.remove("show");

});

</script>

</body>
</html>
