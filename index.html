<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>999コイン｜47都道府県 塗り絵LIVE</title>


<!-- D3.js -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>


<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #eeeeee;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

    color: #222;

    overflow: hidden;
}


/* =====================================================
   9:16 メイン画面
===================================================== */

body {

    display: flex;

    align-items: center;
    justify-content: center;
}


.app {

    width: min(
        100vw,
        calc(100dvh * 9 / 16)
    );

    height: min(
        100dvh,
        calc(100vw * 16 / 9)
    );

    aspect-ratio: 9 / 16;

    background: #ffffff;

    display: flex;

    flex-direction: column;

    overflow: hidden;

    position: relative;
}


/* =====================================================
   タイトル
===================================================== */

.header {

    flex: 0 0 auto;

    padding:
        8px
        10px
        3px;

    text-align: center;

    background: #ffffff;
}


.title {

    font-size:
        clamp(17px, 5vw, 25px);

    line-height: 1.2;

    font-weight: 900;

    min-height: 1.2em;

    padding: 3px 6px;

    border-radius: 8px;

    cursor: text;

    outline: none;

    word-break: break-word;

    user-select: text;
}


/*
   タイトル編集時
*/

.title:focus {

    background: #f3f3f3;

    box-shadow:
        0 0 0 2px #dddddd inset;
}


/*
   タイトルが空になった場合
*/

.title:empty::before {

    content: "タイトルを入力";

    color: #aaaaaa;
}


.subtitle {

    margin-top: 1px;

    font-size:
        clamp(9px, 2.6vw, 13px);

    color: #777777;

    line-height: 1.3;
}


/* =====================================================
   カウンター
===================================================== */

.stats {

    flex: 0 0 auto;

    display: flex;

    gap: 6px;

    padding:
        3px
        8px
        4px;
}


.statBox {

    flex: 1;

    text-align: center;

    background: #f4f4f4;

    border-radius: 9px;

    padding:
        4px
        3px;
}


.statLabel {

    font-size:
        clamp(8px, 2.2vw, 11px);

    color: #777777;
}


.statNumber {

    margin-top: 0;

    font-size:
        clamp(16px, 4.5vw, 23px);

    font-weight: 900;

    line-height: 1.1;
}


/* =====================================================
   メッセージ
===================================================== */

.message {

    flex: 0 0 auto;

    margin:
        0
        8px
        3px;

    padding:
        4px
        6px;

    min-height: 28px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background: #fff5df;

    color: #765000;

    border-radius: 8px;

    font-size:
        clamp(8px, 2.5vw, 12px);

    font-weight: 800;

    line-height: 1.25;
}


/* =====================================================
   地図エリア
===================================================== */

.mapArea {

    flex: 1 1 auto;

    min-height: 0;

    width: 100%;

    padding:
        0
        2px;

    position: relative;

    overflow: hidden;
}


#map {

    display: block;

    width: 100%;

    height: 100%;

    background: #ffffff;

    touch-action: manipulation;
}


/* =====================================================
   都道府県ポリゴン
===================================================== */

.prefecture {

    fill: #eeeeee;

    fill-opacity: 1;

    stroke: #666666;

    stroke-width: 0.8;

    vector-effect: non-scaling-stroke;

    cursor: pointer;

    transition:
        fill 0.15s ease,
        stroke 0.15s ease;
}


/*
   マウスを乗せたとき
*/

.prefecture:hover {

    fill: #ffe082;
}


/*
   999コイン受信後
*/

.prefecture.ready {

    fill: #fff0a8;
}


/*
   塗り済み
*/

.prefecture.painted {

    fill: #ff70a6;

    stroke: #8d2853;

    stroke-width: 1.2;
}


/* =====================================================
   都道府県名
===================================================== */

.prefecture-label {

    pointer-events: none;

    user-select: none;

    fill: #333333;

    font-size: 9px;

    font-weight: 700;

    text-anchor: middle;

    dominant-baseline: middle;

}


/* =====================================================
   操作ボタン
===================================================== */

.controls {

    flex: 0 0 auto;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 6px;

    padding:
        5px
        9px
        7px;

    background: #ffffff;
}


button {

    border: none;

    border-radius: 10px;

    min-height: 40px;

    padding:
        6px
        5px;

    font-size:
        clamp(10px, 3vw, 14px);

    font-weight: 900;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;
}


/* 999コイン */

#coinButton {

    background: #ff4f91;

    color: #ffffff;
}


#coinButton.ready {

    background: #e91e63;

    animation:
        pulse 0.9s infinite;
}


/* リセット */

#resetButton {

    background: #eeeeee;

    color: #333333;
}


@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.03);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   完成画面
===================================================== */

.complete {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    text-align: center;

    background:
        rgba(255,255,255,0.97);
}


.complete.show {

    display: flex;
}


.completeInner {

    width: 100%;
}


.completeTitle {

    font-size:
        clamp(30px, 9vw, 42px);

    font-weight: 1000;

    color: #ff4f91;
}


.completeText {

    margin-top: 12px;

    font-size:
        clamp(14px, 4vw, 19px);

    line-height: 1.7;

    font-weight: 800;
}


.completeButton {

    margin-top: 22px;

    width: 100%;

    background: #222222;

    color: #ffffff;
}


/* =====================================================
   読み込み中
===================================================== */

.loading {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #888888;

    font-size: 14px;

    padding: 20px;
}


/* =====================================================
   PCで表示したときも9:16を維持
===================================================== */

@media (min-width: 700px) {

    body {

        background: #dddddd;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         タイトル
    ================================================== -->

    <div class="header">

        <div
            id="editableTitle"
            class="title"
            contenteditable="true"
            spellcheck="false"
            title="タップしてタイトルを変更"
        >
            🎁 999コインで47都道府県を塗ろう！
        </div>


        <div class="subtitle">

            1回の999コイン → 1都道府県を塗ります

        </div>

    </div>



    <!-- =================================================
         カウンター
    ================================================== -->

    <div class="stats">


        <div class="statBox">

            <div class="statLabel">
                塗った県
            </div>

            <div class="statNumber">

                <span id="paintedCount">
                    0
                </span>

                /47

            </div>

        </div>


        <div class="statBox">

            <div class="statLabel">
                999コイン
            </div>

            <div class="statNumber">

                <span id="coinCount">
                    0
                </span>

            </div>

        </div>


    </div>



    <!-- =================================================
         メッセージ
    ================================================== -->

    <div
        id="message"
        class="message"
    >

        「999コイン受信」を押してから
        塗りたい都道府県をタップ

    </div>



    <!-- =================================================
         地図
    ================================================== -->

    <div class="mapArea">

        <div
            id="loading"
            class="loading"
        >

            47都道府県の
            ポリゴンデータを読み込んでいます…

        </div>


        <svg
            id="map"
            viewBox="0 0 1000 1000"
            preserveAspectRatio="xMidYMid meet"
            style="display:none;"
        >

        </svg>

    </div>



    <!-- =================================================
         ボタン
    ================================================== -->

    <div class="controls">


        <button id="coinButton">

            💰 999コイン受信

        </button>


        <button id="resetButton">

            🔄 リセット

        </button>


    </div>



    <!-- =================================================
         完成画面
    ================================================== -->

    <div
        id="complete"
        class="complete"
    >

        <div class="completeInner">


            <div class="completeTitle">

                🎉 COMPLETE!

            </div>


            <div class="completeText">

                47都道府県コンプリート！

                <br>

                みんなの応援ありがとう！

            </div>


            <button
                id="closeComplete"
                class="completeButton"
            >

                地図を見る

            </button>


        </div>

    </div>


</div>



<script>

/* =====================================================
   GeoJSON
===================================================== */


/*
 * 47都道府県ポリゴンデータ
 */

const GEOJSON_URL =
    "https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson";



/* =====================================================
   状態
===================================================== */

const state = {

    armed: false,

    painted: new Set(),

    coins: 0

};



/* =====================================================
   DOM
===================================================== */

const svg =
    d3.select("#map");


const loading =
    document.getElementById("loading");


const message =
    document.getElementById("message");


const coinButton =
    document.getElementById("coinButton");


const resetButton =
    document.getElementById("resetButton");


const paintedCount =
    document.getElementById("paintedCount");


const coinCount =
    document.getElementById("coinCount");


const complete =
    document.getElementById("complete");


const closeComplete =
    document.getElementById("closeComplete");


const titleElement =
    document.getElementById("editableTitle");



/* =====================================================
   タイトル保存
===================================================== */


/*
 * 前回保存したタイトルがあれば表示
 */

const savedTitle =
    localStorage.getItem("prefecturePaintTitle");


if (savedTitle !== null) {

    titleElement.textContent =
        savedTitle;

}


/*
 * タイトルを変更するたび保存
 */

titleElement.addEventListener(
    "input",
    function() {

        localStorage.setItem(
            "prefecturePaintTitle",
            titleElement.textContent.trim()
        );

    }
);


/*
 * Enterで改行しない
 */

titleElement.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            titleElement.blur();

        }

    }
);



/* =====================================================
   メッセージ
===================================================== */

function setMessage(text) {

    message.textContent =
        text;

}



/* =====================================================
   都道府県名取得
===================================================== */

function getPrefectureName(feature) {

    const p =
        feature.properties || {};


    return (
        p.name_ja ||
        p.name ||
        p.nam_ja ||
        p.N03_001 ||
        p.N03_003 ||
        p.prefecture ||
        p.NAME_1 ||
        ""
    );

}



/* =====================================================
   地図読み込み
===================================================== */

async function loadMap() {

    try {

        const response =
            await fetch(
                GEOJSON_URL
            );


        if (!response.ok) {

            throw new Error(
                "GeoJSON HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * 47都道府県だけを抽出
         */

        const features =
            data.features.filter(
                feature => {

                    const name =
                        getPrefectureName(
                            feature
                        );

                    return (
                        name &&
                        name !== "日本"
                    );

                }
            );


        if (!features.length) {

            throw new Error(
                "都道府県データが見つかりません"
            );

        }



        /* =================================================
           地図投影
        ================================================= */


        const featureCollection = {

            type: "FeatureCollection",

            features: features

        };


        /*
         * 1000×1000のSVG内に
         * 日本全体を最大サイズで配置
         */

        const projection =
            d3.geoMercator()
                .fitExtent(
                    [
                        [10, 10],
                        [990, 990]
                    ],
                    featureCollection
                );


        const path =
            d3.geoPath()
                .projection(
                    projection
                );



        /* =================================================
           ポリゴン描画
        ================================================= */


        svg.selectAll("*")
            .remove();


        svg.selectAll(
            ".prefecture"
        )
        .data(features)
        .join("path")

        .attr(
            "class",
            "prefecture"
        )

        .attr(
            "d",
            path
        )

        .attr(
            "data-name",
            feature =>
                getPrefectureName(
                    feature
                )
        )


        /*
         * タップ
         */

        .on(
            "click",
            function(event, feature) {

                const name =
                    getPrefectureName(
                        feature
                    );


                selectPrefecture(
                    name,
                    this
                );

            }
        )



        /*
         * マウス・タップ時の
         * ブラウザ標準タイトル
         */

        .append("title")

        .text(
            feature =>
                getPrefectureName(
                    feature
                )
        );



        /* =================================================
           都道府県名
        ================================================= */


        svg.selectAll(
            ".prefecture-label"
        )
        .data(features)
        .join("text")

        .attr(
            "class",
            "prefecture-label"
        )

        .attr(
            "x",
            feature =>
                path.centroid(
                    feature
                )[0]
        )

        .attr(
            "y",
            feature =>
                path.centroid(
                    feature
                )[1]
        )

        .text(
            feature =>
                getPrefectureName(
                    feature
                )
        );



        /*
         * 表示
         */

        loading.style.display =
            "none";


        svg.style(
            "display",
            "block"
        );


        setMessage(
            "「999コイン受信」を押してから、塗りたい都道府県をタップ"
        );


    } catch (error) {

        console.error(error);


        loading.innerHTML =
            "地図の読み込みに失敗しました。<br>" +
            "インターネット接続を確認してください。";

    }

}



/* =====================================================
   都道府県を塗る
===================================================== */

function selectPrefecture(
    name,
    element
) {


    if (!name) {

        return;

    }


    /*
     * 999コイン待機中ではない
     */

    if (!state.armed) {

        setMessage(
            "先に「999コイン受信」を押してください！"
        );

        return;

    }


    /*
     * すでに塗った県
     */

    if (
        state.painted.has(name)
    ) {

        setMessage(
            name +
            " は、すでに塗られています！"
        );

        return;

    }


    /*
     * 塗った県として登録
     */

    state.painted.add(
        name
    );


    /*
     * 999コインを1回消費
     */

    state.coins++;


    /*
     * 次の999コイン待ちへ
     */

    state.armed =
        false;


    /*
     * ポリゴンを塗る
     */

    element.classList.remove(
        "ready"
    );


    element.classList.add(
        "painted"
    );


    /*
     * ボタン状態
     */

    coinButton.classList.remove(
        "ready"
    );


    coinButton.textContent =
        "💰 999コイン受信";


    /*
     * カウンター更新
     */

    updateCounters();


    /*
     * メッセージ
     */

    setMessage(
        "🎨 " +
        name +
        " を塗りました！ 次の999コインを待っています。"
    );


    /*
     * 全県完成
     */

    if (
        state.painted.size >= 47
    ) {

        setMessage(
            "🎊 47都道府県コンプリート！"
        );


        setTimeout(
            function() {

                complete.classList.add(
                    "show"
                );

            },
            500
        );

    }

}



/* =====================================================
   カウンター更新
===================================================== */

function updateCounters() {

    paintedCount.textContent =
        state.painted.size;


    coinCount.textContent =
        state.coins;

}



/* =====================================================
   999コイン受信ボタン
===================================================== */

coinButton.addEventListener(
    "click",
    function() {


        /*
         * 完成後
         */

        if (
            state.painted.size >= 47
        ) {

            return;

        }


        /*
         * すでに待機中なら解除
         */

        if (state.armed) {

            state.armed =
                false;


            coinButton.classList.remove(
                "ready"
            );


            coinButton.textContent =
                "💰 999コイン受信";


            /*
             * 全ポリゴンの
             * ready表示を解除
             */

            svg.selectAll(
                ".prefecture"
            )
            .classed(
                "ready",
                false
            );


            setMessage(
                "待機を解除しました。"
            );


            return;

        }


        /*
         * 999コイン受信
         */

        state.armed =
            true;


        coinButton.classList.add(
            "ready"
        );


        coinButton.textContent =
            "🔴 塗る県をタップ";


        /*
         * まだ塗っていない県を
         * 薄黄色で表示
         */

        svg.selectAll(
            ".prefecture"
        )
        .each(
            function(feature) {

                const name =
                    getPrefectureName(
                        feature
                    );


                if (
                    !state.painted.has(
                        name
                    )
                ) {

                    this.classList.add(
                        "ready"
                    );

                }

            }
        );


        setMessage(
            "💰 999コイン受信！ 塗りたい都道府県をタップしてください。"
        );

    }
);



/* =====================================================
   リセット
===================================================== */

resetButton.addEventListener(
    "click",
    function() {


        const answer =
            confirm(
                "塗った県と999コイン数をすべてリセットしますか？"
            );


        if (!answer) {

            return;

        }


        /*
         * 状態を初期化
         */

        state.painted.clear();

        state.coins =
            0;

        state.armed =
            false;


        /*
         * ポリゴンを初期状態に戻す
         */

        svg.selectAll(
            ".prefecture"
        )
        .classed(
            "painted",
            false
        )
        .classed(
            "ready",
            false
        );


        /*
         * ボタン
         */

        coinButton.classList.remove(
            "ready"
        );


        coinButton.textContent =
            "💰 999コイン受信";


        /*
         * カウンター
         */

        updateCounters();


        /*
         * 完成画面を閉じる
         */

        complete.classList.remove(
            "show"
        );


        /*
         * メッセージ
         */

        setMessage(
            "「999コイン受信」を押してから、塗りたい都道府県をタップ"
        );

    }
);



/* =====================================================
   完成画面を閉じる
===================================================== */

closeComplete.addEventListener(
    "click",
    function() {

        complete.classList.remove(
            "show"
        );

    }
);



/* =====================================================
   起動
===================================================== */

loadMap();

</script>

</body>

</html>
