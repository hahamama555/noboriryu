<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>47都道府県 塗り絵LIVE</title>

<!-- D3.js -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #ffffff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

/* =========================
   9:16 本体
========================= */

.app {
  width: min(100vw, calc(100dvh * 9 / 16));
  height: min(100dvh, calc(100vw * 16 / 9));

  aspect-ratio: 9 / 16;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background: #fff;
  color: #111;
}

/* =========================
   タイトル
========================= */

.title {
  flex: 0 0 auto;

  margin: 8px 8px 3px;
  padding: 7px 10px;

  font-size: clamp(18px, 5vw, 28px);
  line-height: 1.2;

  font-weight: 900;
  text-align: center;

  border-radius: 12px;

  min-height: 1.2em;

  cursor: text;

  outline: none;

  word-break: break-word;

  user-select: text;
}

/* タイトル編集中 */
.title:focus {
  background: #f5f5f5;
  box-shadow: 0 0 0 2px #ddd inset;
}

/* 空欄の場合 */
.title:empty::before {
  content: "ここをタップしてタイトルを入力";
  color: #aaa;
}

/* =========================
   サブタイトル
========================= */

.sub {
  flex: 0 0 auto;

  text-align: center;

  font-size: clamp(10px, 2.8vw, 14px);

  font-weight: 700;

  color: #555;

  margin: 0 8px 5px;
}

/* =========================
   地図パネル
========================= */

.panel {
  flex: 1 1 auto;

  min-height: 0;

  display: flex;
  flex-direction: column;

  margin: 0 7px 7px;

  border: 2px solid #111;

  border-radius: 16px;

  padding: 7px;

  overflow: hidden;
}

/* =========================
   地図
========================= */

#mapWrap {
  flex: 1 1 auto;

  min-height: 0;

  width: 100%;

  display: flex;

  justify-content: center;
  align-items: center;

  overflow: hidden;

  background: #fff;

  border-radius: 10px;
}

#map {
  width: 100%;
  height: 100%;

  display: block;

  touch-action: manipulation;
}

/* =========================
   都道府県
========================= */

.pref {
  fill: #ffffff;

  stroke: #333;

  stroke-width: 0.8;

  cursor: pointer;

  transition:
    fill 0.15s ease,
    fill-opacity 0.15s ease;
}

/* マウスを乗せたとき */
.pref:hover {
  fill: #ffe27a;
}

/* 色が付いた状態 */
.pref.active {
  fill: #ff8a3d;

  fill-opacity: 0.9;

  stroke: #9a4b12;

  stroke-width: 1.3;
}

/* =========================
   メッセージ
========================= */

#message {
  flex: 0 0 auto;

  text-align: center;

  font-weight: 800;

  font-size: clamp(11px, 3.2vw, 16px);

  line-height: 1.25;

  min-height: 28px;

  margin: 5px 2px 3px;

  display: flex;

  align-items: center;

  justify-content: center;
}

/* =========================
   統計
========================= */

.stats {
  flex: 0 0 auto;

  display: flex;

  justify-content: center;

  gap: 22px;

  margin-top: 4px;

  font-size: clamp(11px, 3.2vw, 14px);

  font-weight: 700;
}

.num {
  font-size: clamp(18px, 5vw, 23px);

  font-weight: 900;
}

/* =========================
   凡例
========================= */

.legend {
  flex: 0 0 auto;

  display: flex;

  justify-content: center;

  gap: 14px;

  margin-top: 3px;

  font-size: clamp(9px, 2.7vw, 12px);

  color: #555;
}

.dot {
  display: inline-block;

  width: 11px;
  height: 11px;

  border-radius: 3px;

  vertical-align: -2px;

  margin-right: 3px;
}

.orange {
  background: #ff8a3d;
}

.white {
  background: #fff;

  border: 1px solid #555;
}

/* =========================
   説明
========================= */

.note {
  flex: 0 0 auto;

  font-size: 9px;

  color: #888;

  line-height: 1.3;

  margin-top: 3px;

  text-align: center;
}

/* =========================
   読み込み
========================= */

.loading {
  padding: 30px 10px;

  text-align: center;

  color: #777;

  font-size: 13px;
}

/* =========================
   COMPLETE
========================= */

.complete {
  position: fixed;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  background: rgba(255,255,255,0.92);

  z-index: 1000;
}

.complete.show {
  display: flex;
}

.completeBox {
  width: min(86vw, 420px);

  text-align: center;

  padding: 28px 20px;

  border: 3px solid #111;

  border-radius: 20px;

  background: #fff;

  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.completeTitle {
  font-size: clamp(24px, 7vw, 36px);

  font-weight: 900;

  margin-bottom: 10px;
}

.completeText {
  font-size: 16px;

  font-weight: 700;

  line-height: 1.6;

  margin-bottom: 18px;
}

.completeBox button {
  border: 0;

  border-radius: 999px;

  background: #111;

  color: #fff;

  padding: 12px 24px;

  font-weight: 900;

  font-size: 15px;
}
</style>
</head>


<body>

<div class="app">

  <!-- =========================
       タイトル
       タップして変更できます
  ========================== -->

  <div
    id="editableTitle"
    class="title"
    contenteditable="true"
    spellcheck="false"
  >
    🎁 999コインで47都道府県を塗ろう！
  </div>


  <!-- サブタイトル -->

  <div class="sub">
    都道府県をタップして色を塗ろう！
  </div>


  <!-- =========================
       メインパネル
  ========================== -->

  <div class="panel">

    <!-- 地図 -->

    <div id="mapWrap">

      <div id="loading" class="loading">
        47都道府県の地図を読み込んでいます…
      </div>

      <svg
        id="map"
        viewBox="0 0 900 760"
        preserveAspectRatio="xMidYMid meet"
        style="display:none"
      ></svg>

    </div>


    <!-- メッセージ -->

    <div id="message">
      色を塗りたい都道府県をタップしてください
    </div>


    <!-- 統計 -->

    <div class="stats">

      <div>
        塗った県
        <span
          class="num"
          id="count"
        >0</span>
        / 47
      </div>

      <div>
        999コイン
        <span
          class="num"
          id="coins"
        >0</span>
      </div>

    </div>


    <!-- 凡例 -->

    <div class="legend">

      <span>
        <i class="dot orange"></i>
        塗り済み
      </span>

      <span>
        <i class="dot white"></i>
        未塗色
      </span>

    </div>


    <!-- 説明 -->

    <div class="note">
      ※都道府県をもう一度タップすると元の色に戻ります
    </div>

  </div>

</div>


<!-- =========================
     COMPLETE画面
========================= -->

<div
  id="complete"
  class="complete"
>

  <div class="completeBox">

    <div class="completeTitle">
      🎊 COMPLETE!
    </div>

    <div class="completeText">
      47都道府県<br>
      全部塗れました！<br>
      おめでとうございます🎉
    </div>

    <button id="closeComplete">
      閉じる
    </button>

  </div>

</div>


<script>

/* =====================================================
   GeoJSON
===================================================== */

const GEOJSON_URL =
  "https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson";


/* =====================================================
   D3
===================================================== */

const svg = d3.select("#map");


/* =====================================================
   状態管理
===================================================== */

const state = {

  // 色が付いている都道府県
  painted: new Set(),

  // 999コイン数
  coins: 0

};


/* =====================================================
   HTML要素
===================================================== */

const messageEl =
  document.getElementById("message");

const countEl =
  document.getElementById("count");

const coinsEl =
  document.getElementById("coins");

const titleEl =
  document.getElementById("editableTitle");

const completeEl =
  document.getElementById("complete");


/* =====================================================
   タイトル保存
===================================================== */

/*
   タイトルをタップして変更可能。

   入力したタイトルは
   localStorageに保存されるので、

   ページを再読み込みしても
   タイトルが残ります。
*/

const savedTitle =
  localStorage.getItem(
    "prefecturePaintTitle"
  );

if (savedTitle !== null) {

  titleEl.textContent =
    savedTitle;

}


/* タイトル変更時 */

titleEl.addEventListener(
  "input",
  function () {

    localStorage.setItem(
      "prefecturePaintTitle",
      titleEl.textContent.trim()
    );

  }
);


/* Enterで改行しない */

titleEl.addEventListener(
  "keydown",
  function (event) {

    if (event.key === "Enter") {

      event.preventDefault();

      titleEl.blur();

    }

  }
);


/* =====================================================
   都道府県名取得
===================================================== */

function getName(feature) {

  const p =
    feature.properties || {};

  return (
    p.name ||
    p.nam ||
    p.NAME_1 ||
    p.NAME ||
    p.prefecture ||
    p.pref ||
    p.都道府県 ||
    ""
  );

}


/* =====================================================
   数字更新
===================================================== */

function updateStats() {

  countEl.textContent =
    state.painted.size;

  coinsEl.textContent =
    state.coins;

}


/* =====================================================
   都道府県タップ
===================================================== */

function selectPref(
  name,
  element
) {

  if (!name) {
    return;
  }


  /* ==========================================
     すでに塗られている場合
     → もう一度タップで元に戻す
  ========================================== */

  if (
    state.painted.has(name)
  ) {

    /* Setから削除 */

    state.painted.delete(name);


    /* コイン数を1減らす */

    state.coins =
      Math.max(
        0,
        state.coins - 1
      );


    /* 色を元に戻す */

    element.classList.remove(
      "active"
    );


    /* 表示更新 */

    updateStats();


    /* メッセージ */

    messageEl.textContent =
      "↩️ " +
      name +
      " の色を元に戻しました。";


    return;

  }


  /* ==========================================
     まだ塗られていない場合
     → 色を付ける
  ========================================== */

  state.painted.add(name);


  /* 999コインとしてカウント */

  state.coins++;


  /* 色を付ける */

  element.classList.add(
    "active"
  );


  /* 数字更新 */

  updateStats();


  /* メッセージ */

  messageEl.textContent =
    "🎉 " +
    name +
    " を塗りました！";


  /* ==========================================
     47都道府県すべて完成
  ========================================== */

  if (
    state.painted.size === 47
  ) {

    messageEl.textContent =
      "🎊 47都道府県コンプリート！";

    completeEl.classList.add(
      "show"
    );

  }

}


/* =====================================================
   地図読み込み
===================================================== */

function loadMap() {

  fetch(GEOJSON_URL)

    .then(function (response) {

      if (!response.ok) {

        throw new Error(
          "GeoJSON " +
          response.status
        );

      }

      return response.json();

    })


    .then(function (data) {


      /* ======================================
         都道府県だけを抽出
      ====================================== */

      const features =
        data.features.filter(
          function (feature) {

            const name =
              getName(feature);

            return (
              !!name &&
              name !== "日本" &&
              !name.includes("離島") &&
              !name.includes("minor")
            );

          }
        );


      /* ======================================
         地図を画面いっぱいにフィット
      ====================================== */

      const projection =
        d3.geoMercator()
          .fitExtent(
            [
              [18, 18],
              [882, 742]
            ],
            {
              type:
                "FeatureCollection",

              features:
                features
            }
          );


      /* 地図パス */

      const path =
        d3.geoPath(
          projection
        );


      /* 一度クリア */

      svg.selectAll("*")
        .remove();


      /* ======================================
         都道府県を描画
      ====================================== */

      svg
        .selectAll("path.pref")
        .data(features)
        .join("path")

        .attr(
          "class",
          "pref"
        )

        .attr(
          "d",
          function (d) {

            return path(d);

          }
        )

        .attr(
          "data-name",
          function (d) {

            return getName(d);

          }
        )

        /* ==================================
           タップイベント
        ================================== */

        .on(
          "click",
          function (event, d) {

            event.preventDefault();

            selectPref(
              getName(d),
              this
            );

          }
        )

        /* マウスを乗せたときの県名 */

        .append("title")

        .text(
          function (d) {

            return getName(d);

          }
        );


      /* ======================================
         読み込み完了
      ====================================== */

      document
        .getElementById("loading")
        .style.display = "none";


      svg.style(
        "display",
        "block"
      );


      messageEl.textContent =
        "色を塗りたい都道府県をタップしてください";


    })


    /* ======================================
       エラー
    ====================================== */

    .catch(function (error) {

      console.error(error);

      document
        .getElementById("loading")
        .innerHTML =
          "読み込みに失敗しました。<br>" +
          "インターネット接続を確認してください。";

    });

}


/* =====================================================
   COMPLETEを閉じる
===================================================== */

document
  .getElementById("closeComplete")
  .onclick = function () {

    completeEl.classList.remove(
      "show"
    );

  };


/* =====================================================
   初期化
===================================================== */

loadMap();

</script>

</body>
</html>
